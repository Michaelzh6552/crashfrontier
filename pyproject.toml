[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crashfrontier"
version = "0.1.0"
description = "Crash frontiers from option bid-ask quotes: joint bounds on crash probability and conditional depth under risk-neutral and power-utility measures"
readme = "README.md"
authors = [{name = "Jirong Zhuang", email = "yc27478@um.edu.mo"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["options", "asset pricing", "crash risk", "convex optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "clarabel>=0.6",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
excel = ["openpyxl>=3.1", "xlrd>=2.0.1", "pyxlsb>=1.0.10"]
solvers = ["ecos>=2.0.8", "scs>=3.2.4.post1"]
dev = ["pytest>=7"]

[project.scripts]
crashfrontier = "crashfrontier.cli:main"

[tool.setuptools.packages.find]
include = ["crashfrontier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Solution may be inaccurate:UserWarning",
]
